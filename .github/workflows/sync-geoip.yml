name: Sync geoip_cn

# 国内 IP 段变动很慢，不设定时任务；需要刷新时手动触发。
on:
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: "Allow a change larger than the 5% safety limit"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-geoip-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mihomo

      - name: Refresh china IP ranges
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_change || 'false' }}
        run: |
          args=()
          if [[ "$ALLOW_LARGE_CHANGE" == "true" ]]; then
            args+=(--allow-large-change)
          fi
          python3 scripts/update_geoip_cn.py "${args[@]}"

      - name: Rebuild and validate
        run: |
          python3 scripts/build_clash.py --mrs --normalize
          python3 scripts/validate.py

      - name: Commit updated source and rule-sets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/geoip_cn.yaml rules/geoip_cn.yaml mrs/geoip_cn.mrs
          if git diff --staged --quiet; then
            echo "geoip_cn is unchanged"
          else
            git commit -m "ci: sync geoip_cn from upstream [skip ci]"
            git push
          fi
