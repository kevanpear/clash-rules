name: Sync proxy rule-set

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: "Allow an upstream change larger than the 5% safety limit"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-proxy-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mihomo

      - name: Convert upstream GFWList
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_change || 'false' }}
        run: |
          args=()
          if [[ "$ALLOW_LARGE_CHANGE" == "true" ]]; then
            args+=(--allow-large-change)
          fi
          python3 scripts/update_proxy_from_gfwlist.py "${args[@]}"

      - name: Rebuild and validate
        run: |
          python3 scripts/build_clash.py --mrs --normalize
          python3 scripts/check_conflicts.py --strict
          python3 scripts/validate.py
          git diff --check

      - name: Commit updated source and rule-sets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/ rules/ mrs/
          if git diff --staged --quiet; then
            echo "upstream rules are unchanged"
          else
            git commit -m "ci: sync geosite_proxy from upstream [skip ci]"
            git push
          fi
