# ============================================================================
#  Clash / mihomo 配置模板  ——  github.com/kevanpear/clash-rules
#
#  用法：整份复制 → 只改两处即可跑：
#    1) proxies: 段填入你自己的节点（几个都行，策略组用 include-all 自动纳入）
#    2) secret: 改成你自己的面板密码
#  规则集全部来自本仓库、经代理下载、每天自动更新，无需手动维护。
#  适配 mihomo(Clash.Meta) ≥ 1.18.9（mrs 规则集需要）。
# ============================================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true          # 统一延迟计算，url-test 选路更准
tcp-concurrent: true         # 多 IP 域名并发握手，连得更快
find-process-mode: 'off'     # 路由/网关场景无需匹配进程，关掉更省
global-client-fingerprint: chrome
external-controller: "0.0.0.0:9090"
secret: "<改成你自己的面板密码>"     # ← 必改，别用弱密码

# 记住面板里手动选过的节点与 fake-ip 映射，重启不丢
profile:
  store-selected: true
  store-fake-ip: true

# geo 数据每天自动更新（GEOIP,CN 等内置规则用）
geo-auto-update: true
geo-update-interval: 24

# 流量嗅探：allow-lan 下从局域网进来的连接可能只带 IP，靠嗅探还原域名，
# 域名规则集才能命中（旁路由/透明代理强烈建议开）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "*.internal"
    - localhost
    - localhost.*
    - "*.localhost"
    - router.asus.com
    - "*.router.asus.com"
    - "*.tplinkwifi.net"
    - "*.tendawifi.com"
    - "*.miwifi.com"
    - "*.plex.direct"
    - "*.ts.net"
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - time1.cloud.tencent.com
    - ntp.*.com
    - ntp1.aliyun.com
    - ntp.tencent.com
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - localhost.ptlogin2.qq.com
  default-nameserver:            # 只用来解析下面 DoH 服务器自己的域名
    - 223.5.5.5
    - 119.29.29.29
  nameserver:                    # 默认解析走国内 DoH（快、无污染）
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:                      # 命中 fallback-filter 的域名走境外 DNS（经代理）
    - "https://dns.google/dns-query#🍃 Proxies"
    - "https://1.1.1.1/dns-query#🍃 Proxies"
  proxy-server-nameserver:       # 专门解析节点服务器域名，避免死循环
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4

# ============================================================================
#  节点（示例已隐去真实信息，改成你自己的；几个都行，无需改策略组）
# ============================================================================
proxies:
  - name: "示例-WS"
    server: <你的服务器域名>
    port: <端口>
    type: vmess
    uuid: <你的UUID>
    alterId: 0
    cipher: auto
    network: ws
    tls: true
    servername: <你的服务器域名>
    ws-opts:
      path: /<你的路径>
      headers:
        Host: <你的服务器域名>

  - name: "示例-gRPC"
    server: <你的服务器域名>
    port: <端口>
    type: vmess
    uuid: <你的UUID>
    alterId: 0
    cipher: auto
    network: grpc
    tls: true
    servername: <你的服务器域名>
    grpc-opts:
      grpc-service-name: "<服务名>"

# ============================================================================
#  策略组（include-all: 自动纳入上面所有节点，加/删节点无需改这里）
# ============================================================================
proxy-groups:
  - name: "🍃 Proxies"        # 主代理组：默认出口
    type: select
    include-all: true
    proxies:
      - "⭐️ Auto"

  - name: "⭐️ Auto"          # 自动测速选最快
    type: url-test
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🤖 AI"            # OpenAI / Claude / Gemini / Google
    type: select
    include-all: true
    proxies:
      - "🍃 Proxies"
      - "⭐️ Auto"
      - DIRECT

  - name: "📺 Media"         # YouTube / Netflix / Disney / 等流媒体
    type: select
    include-all: true
    proxies:
      - "🍃 Proxies"
      - "⭐️ Auto"
      - DIRECT

  - name: "🎮 Game"          # PlayStation / Sony
    type: select
    include-all: true
    proxies:
      - "🍃 Proxies"
      - "⭐️ Auto"
      - DIRECT

  - name: "🍂 Domestic"      # 国内直连（可整体切代理排查线路）
    type: select
    proxies:
      - DIRECT
      - "🍃 Proxies"

  - name: "🐟 漏网之鱼"       # 兜底：没命中任何规则的流量，默认走代理
    type: select
    include-all: true
    proxies:
      - "🍃 Proxies"
      - "🍂 Domestic"
      - DIRECT

# ============================================================================
#  规则集（github.com/kevanpear/clash-rules，经代理下载、每天自动更新）
#    含 keyword/regex 的集用 source(classical)，其余用 mrs(最快)，
#    reject/win_* 无 mrs 产物故用 rules(domain)。
# ============================================================================
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/rules/geosite_reject.yaml"
    path: ./ruleset/geosite_reject.yaml
    interval: 86400
    proxy: "🍃 Proxies"
  win_spy:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/rules/geosite_win_spy.yaml"
    path: ./ruleset/geosite_win_spy.yaml
    interval: 86400
    proxy: "🍃 Proxies"
  openai:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/source/geosite_openai.yaml"
    path: ./ruleset/geosite_openai.yaml
    interval: 86400
    proxy: "🍃 Proxies"
  claude:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_claude.mrs"
    path: ./ruleset/geosite_claude.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  google:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_google.mrs"
    path: ./ruleset/geosite_google.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  gemini:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_google-gemini.mrs"
    path: ./ruleset/geosite_google-gemini.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  youtube:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/source/geosite_youtube.yaml"
    path: ./ruleset/geosite_youtube.yaml
    interval: 86400
    proxy: "🍃 Proxies"
  netflix:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/source/geosite_netflix.yaml"
    path: ./ruleset/geosite_netflix.yaml
    interval: 86400
    proxy: "🍃 Proxies"
  disney:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_disney.mrs"
    path: ./ruleset/geosite_disney.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  primevideo:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_primevideo.mrs"
    path: ./ruleset/geosite_primevideo.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  hbo:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_hbo.mrs"
    path: ./ruleset/geosite_hbo.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  spotify:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_spotify.mrs"
    path: ./ruleset/geosite_spotify.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  tiktok:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_tiktok.mrs"
    path: ./ruleset/geosite_tiktok.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  playstation:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_playstation.mrs"
    path: ./ruleset/geosite_playstation.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  win_update:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/rules/geosite_win_update.yaml"
    path: ./ruleset/geosite_win_update.yaml
    interval: 86400
    proxy: "🍃 Proxies"
  cn_direct:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/mrs/geosite_direct.mrs"
    path: ./ruleset/geosite_direct.mrs
    interval: 86400
    proxy: "🍃 Proxies"
  proxy:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/kevanpear/clash-rules/master/source/geosite_proxy.yaml"
    path: ./ruleset/geosite_proxy.yaml
    interval: 86400
    proxy: "🍃 Proxies"

# ============================================================================
#  规则（顺序即优先级，从上往下匹配，别打乱分组顺序）
# ============================================================================
rules:
  # ---- 拦截：广告 / 追踪 / Windows 遥测 ----
  - RULE-SET,reject,REJECT
  - RULE-SET,win_spy,REJECT              # 想保 Windows 功能可改成 🍂 Domestic
  # ---- AI ----
  - RULE-SET,openai,🤖 AI
  - RULE-SET,claude,🤖 AI
  - RULE-SET,google,🤖 AI
  - RULE-SET,gemini,🤖 AI
  # ---- 流媒体 / 音乐 ----
  - RULE-SET,youtube,📺 Media
  - RULE-SET,netflix,📺 Media
  - RULE-SET,disney,📺 Media
  - RULE-SET,primevideo,📺 Media
  - RULE-SET,hbo,📺 Media
  - RULE-SET,spotify,📺 Media
  - RULE-SET,tiktok,📺 Media
  # ---- 游戏 ----
  - RULE-SET,playstation,🎮 Game
  # ---- 直连：Windows 更新 + 国内域名大盘（fake-ip 下靠域名精确判国内站）----
  - RULE-SET,win_update,🍂 Domestic
  - RULE-SET,cn_direct,🍂 Domestic
  # ---- 走代理：GFWList 大盘（必须放在国内直连之后，避免误伤该直连的域名）----
  - RULE-SET,proxy,🍃 Proxies
  # ---- 兜底：按 IP 判定 ----
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,🍂 Domestic
  - MATCH,🐟 漏网之鱼
